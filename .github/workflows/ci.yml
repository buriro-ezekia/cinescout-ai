name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Run Ruff
        run: python -m ruff check app scripts tests

      - name: Run tests
        run: python -m pytest -q

      - name: Check offline evaluation contract
        run: python scripts/check_offline_evals.py

      - name: Check Phase 1 repository contract
        run: python scripts/check_phase1.py

      - name: Check Phase 2 offline contract
        run: python scripts/check_phase2.py
